[package]
name = "time-fly"
version = "0.1.0"
edition = "2024"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = "thin"


[dependencies]
anyhow = "1.0"
bevy = { version = "0.18.1" }
rand_core = "0.10"
bevy_rand = "0.14"
bevy_prng = { version = "0.14", features = ["wyrand"] }
time = { version = "0.3.44", features = [
    "formatting",
    "local-offset",
    "macros",
] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_UI_Input_Ime",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
